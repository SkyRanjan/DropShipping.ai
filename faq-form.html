<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faq | Dropshipping.ai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1><strong>Dropshipping.ai</strong></h1></header>  
    <section style="margin-left: 450px;">
    <form action="faq.html" method="get" >
        Enter name: <input type="text" id="name" name="name"><br>
        Enter age: <input type="number" id="age" name="age"><br>
        Enter dob: <input type="date" id="dob" name="dob"><br>
        Enter address: <textarea name="address" id="address"></textarea><br>
        Email: <input type="email" name="email" id="email"><br>
        Mobile: <input type="number" name="mobile" id="mobile"><br>
        Gender: <br>
        <input type="radio" name="question" id="male">M
        <input type="radio" name="question" id="female">F
        <input type="radio" name="question" id="others">O<br>
        Qualification: <br>
        <input type="checkbox" name="SSLC" id="SSLC">SSLC
        <input type="checkbox" name="plus two" id="plus two">plus two
        <input type="checkbox" name="B.Tech" id="B.Tech">B.Tech
        <input type="checkbox" name="M.Tech" id="M.Tech">M.Tech
        <input type="checkbox" name="Phd" id="Phd">Phd<br>
        Type your question here: <input type="text" id="question"><br>
        <input type="submit" value="submit">
        <input type="reset">
    </form>
</section>
</body>
</html>
